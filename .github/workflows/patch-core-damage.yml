name: One-shot core damage resolver patch

on:
  push:
    branches:
      - research/14-burst-baseline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
      - name: Patch core damage resolver and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crown_mast_engine/engine.py')
          text = path.read_text(encoding='utf-8')
          old = '''            + result.collection_weapon_effect(\n                request.actor,\n                "core_damage_pct",\n            )\n'''
          new = '''            + result.collection_weapon_effect(\n                request.actor,\n                "core_damage_pct",\n            )\n            + buffs.core_damage_pct\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('expected core damage anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/patch-core-damage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crown_mast_engine/engine.py
          git commit -m "Apply character core damage buffs"
          git push origin HEAD:research/14-burst-baseline
