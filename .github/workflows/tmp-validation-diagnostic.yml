name: Temporary Final Study 1 Preflight

on:
  push:
    branches:
      - research/14-burst-baseline
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused Study 1 and repaired actor tests
        run: |
          python -m unittest \
            tests.test_analysis.RotationAnalysisTests.test_default_liter_baseline_has_standard_break_even \
            tests.test_research.ComparisonReportTests.test_report_preserves_baseline_totals_and_research_metrics \
            tests.test_selected_actor_reload_gates \
            tests.test_b1_characters \
            tests.test_scarlet_black_shadow \
            tests.test_liberalio \
            tests.test_combat \
            tests.test_wave_a_study -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate and validate all Study 1 cases without simulation
        run: |
          python - <<'PY'
          from crown_mast_engine.timeline import RAID14_TIMELINE
          from crown_mast_engine.wave_a_study import (
              WAVE_A_BLOCKED_ACTORS,
              WAVE_A_DEFENSE_ANCHORS,
              WAVE_A_CORE_HIT_RATE_PCT,
              WAVE_A_EXECUTION_GATED_ACTORS,
              WAVE_A_GROWTH_PROFILES,
              WAVE_A_SCENARIO_COUNT,
              WAVE_A_STUDY_ID,
              WAVE_A_VALID_ROSTER_COUNT,
              build_wave_a_roster_cases,
              iter_wave_a_rosters,
              wave_a_reload_speed_ceiling_pct,
              wave_a_study_definition,
          )

          rosters = tuple(iter_wave_a_rosters())
          assert len(rosters) == WAVE_A_VALID_ROSTER_COUNT == 87
          assert WAVE_A_EXECUTION_GATED_ACTORS == frozenset()
          assert wave_a_study_definition()['execution_ready'] is True
          assert wave_a_reload_speed_ceiling_pct() == 89.47
          assert tuple(p.profile_id for p in WAVE_A_GROWTH_PROFILES) == (
              'g2-ol0-sr5',
              'g3-ol0-sr15-e3-a3',
              'g4-ol5-sr15-e4-a4-ammo3',
          )

          case_ids = set()
          count = 0
          defs = set(WAVE_A_DEFENSE_ANCHORS.values())
          cores = set(WAVE_A_CORE_HIT_RATE_PCT.values())
          growth_ids = {p.profile_id for p in WAVE_A_GROWTH_PROFILES}

          for roster in rosters:
              assert len(set(roster.members)) == 5
              assert not WAVE_A_BLOCKED_ACTORS.intersection(roster.members)
              cases = build_wave_a_roster_cases(roster)
              assert len(cases) == 324
              for case in cases:
                  assert case.case_id not in case_ids
                  case_ids.add(case.case_id)
                  count += 1
                  assert case.labels['study_id'] == WAVE_A_STUDY_ID
                  assert case.labels['growth_design'] == 'full27-three-level'
                  assert case.labels['b1_profile'] in growth_ids
                  assert case.labels['main_profile'] in growth_ids
                  assert case.labels['secondary_profile'] in growth_ids
                  assert case.scenario.timeline == RAID14_TIMELINE
                  assert case.scenario.combat_settings.boss_def in defs
                  assert case.scenario.combat_settings.core_hit_rate_pct in cores

          assert count == len(case_ids) == WAVE_A_SCENARIO_COUNT == 28188
          print('Study 1 preflight cases:', count)
          print('Study ID:', WAVE_A_STUDY_ID)
          print('Rosters:', len(rosters))
          print('Growth points per environment: 27')
          print('Environments per roster: 12')
          print('Execution model gates:', len(WAVE_A_EXECUTION_GATED_ACTORS))
          print('Simulation executed: no')
          PY
