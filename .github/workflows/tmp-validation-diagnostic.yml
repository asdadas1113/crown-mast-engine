name: Temporary Validation Diagnostic

on:
  push:
    branches:
      - research/14-burst-baseline
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repaired numerical baselines
        run: |
          python -m unittest \
            tests.test_analysis.RotationAnalysisTests.test_default_liter_baseline_has_standard_break_even \
            tests.test_research.ComparisonReportTests.test_report_preserves_baseline_totals_and_research_metrics \
            tests.test_scarlet_black_shadow.ScarletBlackShadowAnalysisTests.test_strong_distributed_secondary_still_favors_conventional -v
      - name: Verify selected reload gates
        run: |
          python -m unittest \
            tests.test_selected_actor_reload_gates \
            tests.test_b1_characters \
            tests.test_liberalio \
            tests.test_combat \
            tests.test_wave_a_study -v
