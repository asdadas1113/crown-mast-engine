name: Temporary Validation Diagnostic

on:
  push:
    branches:
      - research/14-burst-baseline
  workflow_dispatch:

jobs:
  numerical:
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Print baseline diagnostics
        run: |
          python - <<'PY'
          from tests.simulation_fixtures import standard_rotation_comparison
          from crown_mast_engine.analysis import analyze_rotations
          from crown_mast_engine.models import TeamRoster
          base = standard_rotation_comparison().overall
          sbs = analyze_rotations(roster=TeamRoster(main_b3='rapi-red-hood', secondary_b3='scarlet-black-shadow')).overall
          print('python baseline team_c', repr(base.team_c))
          print('python baseline team_f', repr(base.team_f))
          print('baseline c diff', repr(base.team_c - 2168143852.8701534))
          print('baseline f diff', repr(base.team_f - 2141385963.124464))
          print('sbs team_c', repr(sbs.team_c))
          print('sbs team_f', repr(sbs.team_f))
          PY
      - name: Run three previously failing tests
        continue-on-error: true
        run: |
          python -m unittest \
            tests.test_analysis.RotationAnalysisTests.test_default_liter_baseline_has_standard_break_even \
            tests.test_research.ComparisonReportTests.test_report_preserves_baseline_totals_and_research_metrics \
            tests.test_scarlet_black_shadow.ScarletBlackShadowAnalysisTests.test_strong_distributed_secondary_still_favors_conventional -v
