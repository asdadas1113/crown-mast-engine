name: Temporary character audit patch

on:
  push:
    branches:
      - tmp/rapi-b1-added-character-audit

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/rapi-b1-added-character-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply audited character patch
        run: python scripts/_tmp_character_audit_runner4.py
      - name: Compile
        run: python -m compileall -q crown_mast_engine tests scripts
      - name: Full regression suite
        run: python -m unittest discover -v tests
      - name: Commit verified patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_tmp_character_audit_patch.py scripts/_tmp_character_audit_finalize.py scripts/_tmp_character_audit_runner.py scripts/_tmp_character_audit_runner2.py scripts/_tmp_character_audit_runner3.py scripts/_tmp_character_audit_runner4.py .github/workflows/tmp-character-audit.yml
          git add -A
          git commit -m "Add Rapi B1 and audit character mechanics"
          git push origin HEAD:tmp/rapi-b1-added-character-audit
