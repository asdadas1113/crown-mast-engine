name: Temporary character audit patch

on:
  push:
    branches:
      - tmp/rapi-b1-added-character-audit

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/rapi-b1-added-character-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply audited character patch
        run: python scripts/_tmp_character_audit_runner4.py
      - name: Compile
        run: python -m compileall -q crown_mast_engine tests scripts
      - name: Full regression suite
        run: python -m unittest discover -v tests
      - name: Commit verified clean source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/sample-batch-parallel.yml
          find crown_mast_engine scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find crown_mast_engine scripts tests -name '*.pyc' -delete
          git add -A
          git commit -m "Add Rapi B1 and audit character mechanics"
          git push origin HEAD:tmp/rapi-b1-added-character-audit
