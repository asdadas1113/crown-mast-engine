name: One-time sustained engine patch

on:
  push:
    branches:
      - research/14-burst-baseline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch sustained damage resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crown_mast_engine/engine.py')
          text = path.read_text(encoding='utf-8')
          old = '''                sequential_damage_pct=request.sequential_damage_pct,\n                sequential_multiplier=request.sequential_multiplier,\n'''
          new = '''                sequential_damage_pct=request.sequential_damage_pct,\n                sustained_damage_pct=buffs.sustained_damage_pct,\n                sequential_multiplier=request.sequential_multiplier,\n'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected engine resolver anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crown_mast_engine/engine.py
          git commit -m "Pass sustained damage buffs into resolver"
          git push origin HEAD:research/14-burst-baseline
