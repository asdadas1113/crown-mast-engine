name: Temporary research hardening validation

on:
  push:
    branches:
      - research/14-burst-baseline
    paths:
      - .github/workflows/tmp-research-hardening.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply research infrastructure hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # P1: content-address the loaded catalog and record explicit skill overrides.
          replace_once(
              'crown_mast_engine/characters.py',
              'import json\nfrom dataclasses import dataclass, replace\n',
              'import json\nfrom hashlib import sha256\nfrom dataclasses import dataclass, replace\n',
          )
          replace_once(
              'crown_mast_engine/characters.py',
              '''        definitions = tuple(\n            replacement if item.slug == slug else item\n            for item in self.definitions\n        )\n        return CharacterCatalog(definitions, self.scope)\n''',
              '''        definitions = tuple(\n            replacement if item.slug == slug else item\n            for item in self.definitions\n        )\n        override = f"skill-override:{slug}.{skill}.{key}={value:.17g}"\n        scope = replace(\n            self.scope,\n            source_revision=f"{self.scope.source_revision}; {override}",\n        )\n        return CharacterCatalog(definitions, scope)\n''',
          )
          replace_once(
              'crown_mast_engine/characters.py',
              '''    payloads = tuple(\n        json.loads(path.read_text(encoding="utf-8"))\n        for path in (base_path, *extra_paths)\n    )\n    for payload in payloads:\n''',
              '''    payloads = tuple(\n        json.loads(path.read_text(encoding="utf-8"))\n        for path in (base_path, *extra_paths)\n    )\n    catalog_digest = sha256(\n        json.dumps(\n            payloads,\n            ensure_ascii=False,\n            sort_keys=True,\n            separators=(",", ":"),\n        ).encode("utf-8")\n    ).hexdigest()\n    for payload in payloads:\n''',
          )
          replace_once(
              'crown_mast_engine/characters.py',
              '''    scope = CharacterDataScope(\n        level=int(base_scope_data["level"]),\n        gear=str(base_scope_data["gear"]),\n        core=int(base_scope_data["core"]),\n        skill_levels=tuple(int(value) for value in base_scope_data["skill_levels"]),\n        source_revision="; ".join(dict.fromkeys(source_revisions)),\n    )\n''',
              '''    source_revision = "; ".join(dict.fromkeys(source_revisions))\n    source_revision = f"{source_revision}; catalog-sha256:{catalog_digest}"\n    scope = CharacterDataScope(\n        level=int(base_scope_data["level"]),\n        gear=str(base_scope_data["gear"]),\n        core=int(base_scope_data["core"]),\n        skill_levels=tuple(int(value) for value in base_scope_data["skill_levels"]),\n        source_revision=source_revision,\n    )\n''',
          )

          # P2: reject non-finite combat inputs at the model boundary.
          replace_once(
              'crown_mast_engine/combat.py',
              'from math import ceil, floor\n',
              'from math import ceil, floor, isfinite\n',
          )
          replace_once(
              'crown_mast_engine/combat.py',
              '''    def __post_init__(self) -> None:\n        if self.boss_def < 0:\n            raise ValueError("boss_def must be non-negative")\n        if not 0 <= self.core_hit_rate_pct <= 100:\n            raise ValueError("core_hit_rate_pct must be between 0 and 100")\n        if self.element_multiplier <= 0:\n            raise ValueError("element_multiplier must be positive")\n        if any(value <= 0 for value in self.element_multiplier_by_actor.values()):\n            raise ValueError("actor element multipliers must be positive")\n        if self.boss_element is not None and self.boss_element not in ELEMENTS:\n            raise ValueError(f"unsupported boss element: {self.boss_element}")\n        object.__setattr__(\n            self,\n            "element_multiplier_by_actor",\n            MappingProxyType(dict(self.element_multiplier_by_actor)),\n        )\n        if self.startup_delay_frames < 0:\n            raise ValueError("startup_delay_frames must be non-negative")\n        if self.duration_sec <= 0:\n            raise ValueError("duration_sec must be positive")\n''',
              '''    def __post_init__(self) -> None:\n        if not isfinite(self.boss_def) or self.boss_def < 0:\n            raise ValueError("boss_def must be finite and non-negative")\n        if not isfinite(self.core_hit_rate_pct) or not 0 <= self.core_hit_rate_pct <= 100:\n            raise ValueError("core_hit_rate_pct must be finite and between 0 and 100")\n        if not isfinite(self.range_bonus_pct):\n            raise ValueError("range_bonus_pct must be finite")\n        if not isfinite(self.element_multiplier) or self.element_multiplier <= 0:\n            raise ValueError("element_multiplier must be finite and positive")\n        if any(\n            not isfinite(value) or value <= 0\n            for value in self.element_multiplier_by_actor.values()\n        ):\n            raise ValueError("actor element multipliers must be finite and positive")\n        if not isfinite(self.full_burst_bonus_pct):\n            raise ValueError("full_burst_bonus_pct must be finite")\n        if not isfinite(self.boss_damage_taken_pct):\n            raise ValueError("boss_damage_taken_pct must be finite")\n        if self.boss_element is not None and self.boss_element not in ELEMENTS:\n            raise ValueError(f"unsupported boss element: {self.boss_element}")\n        object.__setattr__(\n            self,\n            "element_multiplier_by_actor",\n            MappingProxyType(dict(self.element_multiplier_by_actor)),\n        )\n        if (\n            isinstance(self.startup_delay_frames, bool)\n            or not isinstance(self.startup_delay_frames, int)\n            or self.startup_delay_frames < 0\n        ):\n            raise ValueError("startup_delay_frames must be a non-negative integer")\n        if not isfinite(self.duration_sec) or self.duration_sec <= 0:\n            raise ValueError("duration_sec must be finite and positive")\n''',
          )

          # P2: reject overlapping burst cycles in both research and direct engine paths.
          replace_once(
              'crown_mast_engine/research.py',
              '''        if cycle.b3_slot not in {"main_b3", "secondary_b3"}:\n            raise ValueError(f"cycle {cycle.cycle} has unsupported b3_slot")\n''',
              '''        if cycle.b3_slot not in {"main_b3", "secondary_b3"}:\n            raise ValueError(f"cycle {cycle.cycle} has unsupported b3_slot")\n    for previous, current in zip(timeline, timeline[1:]):\n        if current.b1_time < previous.full_burst_end:\n            raise ValueError(\n                f"burst cycles overlap: {previous.cycle} and {current.cycle}"\n            )\n''',
          )
          replace_once(
              'crown_mast_engine/engine.py',
              '''        self.policy = policy\n        self.roster = roster or TeamRoster()\n        self.timeline = timeline\n        self.catalog = catalog\n''',
              '''        self.policy = policy\n        self.roster = roster or TeamRoster()\n        self.timeline = timeline\n        for previous, current in zip(self.timeline, self.timeline[1:]):\n            if current.b1_time < previous.full_burst_end:\n                raise ValueError(\n                    f"burst cycles overlap: {previous.cycle} and {current.cycle}"\n                )\n        self.catalog = catalog\n''',
          )

          # P2: reject non-finite HTTP numeric inputs as well.
          replace_once(
              'crown_mast_engine/interface.py',
              'from dataclasses import replace\n',
              'from dataclasses import replace\nfrom math import isfinite\n',
          )
          replace_once(
              'crown_mast_engine/interface.py',
              '''def _number(value: Any, path: str) -> float:\n    if isinstance(value, bool) or not isinstance(value, (int, float)):\n        raise TypeError(f"{path} must be numeric")\n    return float(value)\n''',
              '''def _number(value: Any, path: str) -> float:\n    if isinstance(value, bool) or not isinstance(value, (int, float)):\n        raise TypeError(f"{path} must be numeric")\n    number = float(value)\n    if not isfinite(number):\n        raise ValueError(f"{path} must be finite")\n    return number\n''',
          )

          # P2: make the Windows startup banner CP949-safe.
          replace_once(
              'crown_mast_engine/interface.py',
              '    print(f"Crown–Mast interface: http://{host}:{port}")\n',
              '    print(f"Crown-Mast interface: http://{host}:{port}")\n',
          )

          # P2: clear visible build rows before rerender so reset cannot re-save stale inputs.
          replace_once(
              'crown_mast_engine/web/app.js',
              '''  state.builds.clear();\n  syncB3Options($("#main-b3-select"));\n}\n\nfunction collectPayload() {\n''',
              '''  state.builds.clear();\n  buildRows.replaceChildren();\n  syncB3Options($("#main-b3-select"));\n}\n\nfunction collectPayload() {\n''',
          )

          # P2: include vendored PNG exporter in wheels/sdists.
          replace_once(
              'pyproject.toml',
              'crown_mast_engine = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]\n',
              'crown_mast_engine = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js", "web/vendor/*.txt"]\n',
          )

          # Regression tests: catalog provenance.
          replace_once(
              'tests/test_characters.py',
              '    def test_rapi_red_hood_standard_stats(self) -> None:\n',
              '''    def test_skill_value_variant_revision_records_override_and_catalog_hash(self) -> None:\n        standard_revision = STANDARD_CHARACTER_CATALOG.scope.source_revision\n        first = STANDARD_CHARACTER_CATALOG.with_skill_value(\n            "mast-romantic-maid",\n            "skill1",\n            "expected_normal_damage_loss_per_stack_pct",\n            18,\n        )\n        second = STANDARD_CHARACTER_CATALOG.with_skill_value(\n            "mast-romantic-maid",\n            "skill1",\n            "expected_normal_damage_loss_per_stack_pct",\n            18,\n        )\n\n        self.assertIn("catalog-sha256:", standard_revision)\n        self.assertNotEqual(first.scope.source_revision, standard_revision)\n        self.assertEqual(first.scope.source_revision, second.scope.source_revision)\n        self.assertIn(\n            "skill-override:mast-romantic-maid.skill1.expected_normal_damage_loss_per_stack_pct=18",\n            first.scope.source_revision,\n        )\n\n    def test_rapi_red_hood_standard_stats(self) -> None:\n''',
          )
          replace_once(
              'tests/test_research.py',
              'from tests.simulation_fixtures import standard_rotation_comparison\n',
              'from crown_mast_engine.characters import STANDARD_CHARACTER_CATALOG\nfrom tests.simulation_fixtures import standard_rotation_comparison\n',
          )
          replace_once(
              'tests/test_research.py',
              '    def test_unknown_baseline_rotation_is_rejected(self) -> None:\n',
              '''    def test_skill_override_catalog_requires_matching_saved_revision(self) -> None:\n        base = ResearchScenario.standard()\n        variant = STANDARD_CHARACTER_CATALOG.with_skill_value(\n            "mast-romantic-maid",\n            "skill1",\n            "expected_normal_damage_loss_per_stack_pct",\n            18,\n        )\n        with self.assertRaisesRegex(ValueError, "catalog source revision"):\n            run_research_scenario(base, catalog=variant)\n\n        scenario = replace(\n            base,\n            timeline=(base.timeline[0],),\n            combat_settings=replace(base.combat_settings, duration_sec=16),\n            expected_catalog_source_revision=variant.scope.source_revision,\n        )\n        report = run_research_scenario(scenario, catalog=variant)\n        saved = report.to_dict()["scenario"]["expected_revisions"]["catalog_source"]\n        self.assertEqual(saved, variant.scope.source_revision)\n        self.assertIn("skill-override:", saved)\n\n    def test_unknown_baseline_rotation_is_rejected(self) -> None:\n''',
          )

          # Regression tests: non-finite combat values.
          replace_once(
              'tests/test_combat.py',
              '    def test_min_firing_rounds_adjustment_defaults_on_and_can_be_disabled(self) -> None:\n',
              '''    def test_combat_settings_reject_non_finite_values(self) -> None:\n        with self.assertRaisesRegex(ValueError, "boss_def"):\n            CombatSettings(boss_def=float("nan"))\n        with self.assertRaisesRegex(ValueError, "boss_def"):\n            CombatSettings(boss_def=float("inf"))\n        with self.assertRaisesRegex(ValueError, "duration_sec"):\n            CombatSettings(duration_sec=float("nan"))\n\n    def test_min_firing_rounds_adjustment_defaults_on_and_can_be_disabled(self) -> None:\n''',
          )

          # Regression tests: overlapping burst cycles.
          replace_once(
              'tests/test_timeline.py',
              '    CROWN_CROWN_MAST,\n',
              '    BurstCycle,\n    CROWN_CROWN_MAST,\n',
          )
          replace_once(
              'tests/test_timeline.py',
              '    def test_invalid_builder_inputs_fail_fast(self) -> None:\n',
              '''    def test_overlapping_cycles_fail_in_scenario_and_direct_engine(self) -> None:\n        overlapping = (\n            BurstCycle(1, 1.0, 1.1, 1.2, 1.2, 11.2, "main_b3"),\n            BurstCycle(2, 10.0, 10.1, 10.2, 10.2, 20.2, "secondary_b3"),\n        )\n        with self.assertRaisesRegex(ValueError, "overlap"):\n            replace(ResearchScenario.standard(), timeline=overlapping)\n        with self.assertRaisesRegex(ValueError, "overlap"):\n            simulate_rotation(CROWN_CROWN_MAST, timeline=overlapping)\n\n    def test_invalid_builder_inputs_fail_fast(self) -> None:\n''',
          )

          # Regression tests: UI reset, CP949 startup, and package-data declaration.
          replace_once(
              'tests/test_interface.py',
              'import unittest\n',
              'import io\nimport tomllib\nimport unittest\nfrom unittest.mock import patch\n',
          )
          replace_once(
              'tests/test_interface.py',
              '    interface_metadata,\n)\n',
              '    interface_metadata,\n    run_server,\n)\n',
          )
          replace_once(
              'tests/test_interface.py',
              '    def test_checkpoint_aggregate_preserves_ranges_groups_and_extremes(self) -> None:\n',
              '''    def test_reset_discards_visible_build_rows_before_rerender(self) -> None:\n        script = (WEB_ROOT / "app.js").read_text(encoding="utf-8")\n        start = script.index("function setDefaults()")\n        end = script.index("function collectPayload()", start)\n        reset_block = script[start:end]\n        self.assertIn("state.builds.clear();", reset_block)\n        self.assertIn("buildRows.replaceChildren();", reset_block)\n        self.assertLess(\n            reset_block.index("buildRows.replaceChildren();"),\n            reset_block.index("syncB3Options"),\n        )\n\n    def test_server_banner_runs_with_cp949_stdout(self) -> None:\n        buffer = io.BytesIO()\n        stdout = io.TextIOWrapper(buffer, encoding="cp949")\n        with patch("crown_mast_engine.interface.ThreadingHTTPServer") as server_type:\n            server_type.return_value.serve_forever.side_effect = KeyboardInterrupt\n            with patch("sys.stdout", stdout):\n                run_server()\n                stdout.flush()\n        self.assertIn(b"Crown-Mast interface:", buffer.getvalue())\n\n    def test_package_data_declares_vendor_assets(self) -> None:\n        pyproject = WEB_ROOT.parents[1] / "pyproject.toml"\n        payload = tomllib.loads(pyproject.read_text(encoding="utf-8"))\n        patterns = payload["tool"]["setuptools"]["package-data"]["crown_mast_engine"]\n        self.assertIn("web/vendor/*.js", patterns)\n        self.assertIn("web/vendor/*.txt", patterns)\n\n    def test_checkpoint_aggregate_preserves_ranges_groups_and_extremes(self) -> None:\n''',
          )
          PY

      - name: Run focused hardening tests
        run: |
          python -m unittest \
            tests.test_characters.CharacterCatalogTests.test_skill_value_variant_revision_records_override_and_catalog_hash \
            tests.test_research.ResearchScenarioTests.test_skill_override_catalog_requires_matching_saved_revision \
            tests.test_combat.WeaponTimingTests.test_combat_settings_reject_non_finite_values \
            tests.test_timeline.UniformBurstTimelineTests.test_overlapping_cycles_fail_in_scenario_and_direct_engine \
            tests.test_interface.InterfaceTests.test_reset_discards_visible_build_rows_before_rerender \
            tests.test_interface.InterfaceTests.test_server_banner_runs_with_cp949_stdout \
            tests.test_interface.InterfaceTests.test_package_data_declares_vendor_assets

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify wheel contains vendored PNG exporter
        shell: bash
        run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = tuple(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          assert 'crown_mast_engine/web/vendor/html2canvas.min.js' in names
          assert 'crown_mast_engine/web/vendor/html2canvas.LICENSE.txt' in names
          print(wheels[0].name)
          PY

      - name: Commit validated hardening and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-research-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crown_mast_engine tests pyproject.toml .github/workflows/tmp-research-hardening.yml
          git commit -m "Harden research reproducibility and validation"
          git push origin HEAD:research/14-burst-baseline
