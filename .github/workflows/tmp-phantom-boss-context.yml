name: Temporary Phantom boss-context patch

on:
  push:
    branches:
      - tmp/distributed-samples

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/distributed-samples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch boss context and Phantom Fire vulnerability
        run: |
          python - <<'PY'
          from pathlib import Path

          mechanics = Path("crown_mast_engine/mechanics.py")
          text = mechanics.read_text()
          text = text.replace(
              "from .combat import DamageRequest, WeaponShot",
              "from .combat import (\n    STANDARD_COMBAT_SETTINGS,\n    CombatSettings,\n    DamageRequest,\n    WeaponShot,\n)",
          )
          text = text.replace(
              "    duration_sec: float\n\n\nclass CharacterSkillHook",
              "    duration_sec: float\n    combat_settings: CombatSettings = STANDARD_COMBAT_SETTINGS\n\n\nclass CharacterSkillHook",
          )
          mechanics.write_text(text)

          engine = Path("crown_mast_engine/engine.py")
          text = engine.read_text()
          old = "                    timeline=self.timeline,\n                    duration_sec=duration,\n                )"
          new = "                    timeline=self.timeline,\n                    duration_sec=duration,\n                    combat_settings=self.combat_settings,\n                )"
          if old not in text:
              raise SystemExit("SkillHookContext constructor pattern not found")
          engine.write_text(text.replace(old, new, 1))

          phantom = Path("crown_mast_engine/character_mechanics/phantom_favorite_item.py")
          text = phantom.read_text()
          old_doc = '''    The favorite-item Fire-only 18% enemy vulnerability is retained in data but\n    intentionally inactive here: the current character hook context has no boss\n    element. That conditional team-debuff is outside this distributed-structure\n    sample until boss state is exposed to character hooks.\n'''
          text = text.replace(
              old_doc,
              '''    The favorite-item Fire-only 18% enemy vulnerability is applied to the\n    whole roster when the configured boss element is Fire.\n''',
          )
          old_return = '''        self._dist_amp_stacks = 0\n        return (\n            DamageRequest(\n                time=event.time,\n                actor=context.actor,\n                source="burst_distributed",\n                category=DamageCategory.BURST,\n                coefficient_pct=context.definition.skill_value(\n                    "burst", "damage_pct"\n                ),\n                traits=DamageTraits(\n                    category=DamageCategory.BURST,\n                    distributed=True,\n                    core_eligible=False,\n                    range_eligible=False,\n                ),\n            ),\n            BuffWindow(\n                source=context.actor,\n                skill="skill2_dist_amp",\n                stat="distributed_damage_pct",\n                value=0.0,\n                target=context.actor,\n                start=reset_time,\n                end=inf,\n            ),\n        )\n'''
          new_return = '''        self._dist_amp_stacks = 0\n        effects: list[SkillEffect] = [\n            DamageRequest(\n                time=event.time,\n                actor=context.actor,\n                source="burst_distributed",\n                category=DamageCategory.BURST,\n                coefficient_pct=context.definition.skill_value(\n                    "burst", "damage_pct"\n                ),\n                traits=DamageTraits(\n                    category=DamageCategory.BURST,\n                    distributed=True,\n                    core_eligible=False,\n                    range_eligible=False,\n                ),\n            ),\n            BuffWindow(\n                source=context.actor,\n                skill="skill2_dist_amp",\n                stat="distributed_damage_pct",\n                value=0.0,\n                target=context.actor,\n                start=reset_time,\n                end=inf,\n            ),\n        ]\n        if context.combat_settings.boss_element == "Fire":\n            duration = context.definition.skill_value(\n                "burst", "fire_damage_taken_duration_sec"\n            )\n            for target in dict.fromkeys(context.roster.members):\n                effects.append(\n                    BuffWindow(\n                        source=context.actor,\n                        skill="burst_fire_vulnerability",\n                        stat="damage_taken_pct",\n                        value=context.definition.skill_value(\n                            "burst", "fire_damage_taken_pct"\n                        ),\n                        target=target,\n                        start=event.time,\n                        end=event.time + duration,\n                    )\n                )\n        return tuple(effects)\n'''
          if old_return not in text:
              raise SystemExit("Phantom burst block pattern not found")
          phantom.write_text(text.replace(old_return, new_return, 1))

          test = Path("tests/test_phantom_favorite_item.py")
          text = test.read_text()
          text = text.replace(
              "from crown_mast_engine import simulate_rotation",
              "from crown_mast_engine import CombatSettings, simulate_rotation",
          )
          insert = '''\n    def test_fire_boss_activates_team_vulnerability(self) -> None:\n        fire = simulate_rotation(\n            CROWN_CROWN_MAST,\n            roster=PHANTOM_ROSTER,\n            combat_settings=CombatSettings(boss_element="Fire"),\n        )\n        first_burst = next(\n            event.time for event in fire.events\n            if event.event_type == EventType.B3_STAGE_ENTER\n            and event.actor == self.actor\n        )\n        for member in dict.fromkeys(fire.roster.members):\n            self.assertEqual(\n                fire.buff_total(first_burst + 0.001, member, "damage_taken_pct"),\n                18,\n            )\n\n    def test_non_fire_boss_does_not_activate_vulnerability(self) -> None:\n        neutral = simulate_rotation(\n            CROWN_CROWN_MAST,\n            roster=PHANTOM_ROSTER,\n            combat_settings=CombatSettings(boss_element="Iron"),\n        )\n        self.assertFalse(\n            any(\n                window.source == self.actor\n                and window.skill == "burst_fire_vulnerability"\n                for window in neutral.buffs.windows\n            )\n        )\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit("Phantom test footer not found")
          test.write_text(text.replace(marker, insert + marker, 1))
          PY
      - name: Compile
        run: python -m compileall -q crown_mast_engine tests scripts
      - name: Full regression suite
        run: >-
          python -m unittest -v
          tests.test_bready
          tests.test_liberalio
          tests.test_raven
          tests.test_cinderella_crystal_wave
          tests.test_phantom_favorite_item
          tests.test_milk_blooming_bunny
          tests.test_quency_escape_queen
          tests.test_characters
          tests.test_b1_characters
          tests.test_buffs
          tests.test_damage
          tests.test_combat
          tests.test_engine
          tests.test_helm
          tests.test_neon_vision_eye
          tests.test_snow_white_heavy_arms
          tests.test_timeline
          tests.test_checkpoints_v3
      - name: Commit verified patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-phantom-boss-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crown_mast_engine/mechanics.py crown_mast_engine/engine.py crown_mast_engine/character_mechanics/phantom_favorite_item.py tests/test_phantom_favorite_item.py .github/workflows/tmp-phantom-boss-context.yml
          git commit -m "Model Phantom Fire-target vulnerability"
          git push origin HEAD:tmp/distributed-samples
