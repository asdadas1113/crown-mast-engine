name: Temporary hygiene and model-risk audit

on:
  push:
    branches: [research/14-burst-baseline]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove tracked Python bytecode and add ignore rules
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked" | xargs -r git rm -f --
          fi
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          EOF
          echo "Tracked bytecode remaining:"
          git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true
      - name: Mast hit-loss sensitivity diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from crown_mast_engine import RAID14_TIMELINE
          from crown_mast_engine.analysis import analyze_mast_expected_hit_loss_sensitivity
          from crown_mast_engine.models import TeamRoster

          cases = {
              'default-standard': dict(roster=TeamRoster()),
              'default-raid14': dict(roster=TeamRoster(), timeline=RAID14_TIMELINE),
              'cinderella-raid14': dict(roster=TeamRoster(main_b3='cinderella'), timeline=RAID14_TIMELINE, main_actor='cinderella'),
              'ccw-raid14': dict(roster=TeamRoster(main_b3='cinderella-crystal-wave'), timeline=RAID14_TIMELINE, main_actor='cinderella-crystal-wave'),
          }
          for name, kwargs in cases.items():
              print(f'=== {name} ===')
              results = analyze_mast_expected_hit_loss_sensitivity((0.0, 5.0, 10.0, 18.0, 20.0, 22.0), **kwargs)
              for value, result in results.items():
                  o = result.overall
                  print({
                      'loss_per_stack': value,
                      'winner': o.observed_winner.value,
                      'relative': o.team_relative_change,
                      'break_even': o.break_even_main_share_c,
                      'main_share': o.conventional_main_share,
                      'team_c': o.team_c,
                      'team_f': o.team_f,
                  })
          PY
      - name: Full regression without bytecode generation
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Commit hygiene cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-hygiene-risk-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore
          git status --short
          git commit -m 'Remove generated Python bytecode from source tree'
          git push origin HEAD:research/14-burst-baseline
