name: Temporary Wave A design validation

on:
  push:
    branches: [research/14-burst-baseline]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused Wave A design tests
        run: python -m unittest tests.test_wave_a_study -v
      - name: Full regression
        run: python -m unittest discover -s tests -v
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wave-a-design-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Wave A validation workflow'
          git push origin HEAD:research/14-burst-baseline
