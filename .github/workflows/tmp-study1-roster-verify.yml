name: Temporary Study 1 Roster Verification

on:
  push:
    branches:
      - research/14-burst-baseline
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Study 1 design tests
        run: python -m unittest tests.test_wave_a_study -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
