name: Temporary cadence parity audit

on:
  push:
    branches: [research/14-burst-baseline]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply confirmed source corrections in runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected 1 match got {n}: {old!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          r('crown_mast_engine/combat.py','    boss_damage_taken_pct: float = 0.0\n    startup_delay_frames: int = 8\n','    boss_damage_taken_pct: float = 0.0\n    min_firing_rounds_adjustment: bool = True\n    startup_delay_frames: int = 8\n')
          r('crown_mast_engine/engine.py','                startup_delay_frames=self.combat_settings.startup_delay_frames,\n                shared_charge_modes=shared_charge_modes,\n','                startup_delay_frames=self.combat_settings.startup_delay_frames,\n                pulls_per_second_override=(20.0 if definition.weapon.weapon_type == "SMG" and not self.combat_settings.min_firing_rounds_adjustment else None),\n                shared_charge_modes=shared_charge_modes,\n')
          r('crown_mast_engine/engine.py','                    pulls_per_second_override=mode.pulls_per_second,\n','                    pulls_per_second_override=(mode.pulls_per_second if mode.pulls_per_second is not None else (20.0 if mode.weapon.weapon_type == "SMG" and not self.combat_settings.min_firing_rounds_adjustment else None)),\n')
          r('crown_mast_engine/data/characters.json','          "hit_rate_down_per_stack_pct": 20.0,\n          "expected_normal_damage_loss_per_stack_pct": 20.0,\n','          "hit_rate_down_per_stack_pct": 20.0,\n          "expected_normal_damage_loss_per_stack_pct": 0.0,\n')
          r('crown_mast_engine/data/characters.json','        "hits_per_shot": 1,\n        "burst_gauge_per_shot": 1.25\n      },\n      "skills": {\n        "skill1": {\n          "outside_phase_charge_count": 3.0,','        "hits_per_shot": 1,\n        "burst_gauge_per_shot": 1.25,\n        "charge_release_recovery_frames": 26\n      },\n      "skills": {\n        "skill1": {\n          "outside_phase_charge_count": 3.0,')
          r('crown_mast_engine/research.py','        "boss_damage_taken_pct": settings.boss_damage_taken_pct,\n        "startup_delay_frames": settings.startup_delay_frames,\n','        "boss_damage_taken_pct": settings.boss_damage_taken_pct,\n        "min_firing_rounds_adjustment": settings.min_firing_rounds_adjustment,\n        "startup_delay_frames": settings.startup_delay_frames,\n')
          r('crown_mast_engine/research.py','''    keys = {\n        "boss_def",\n        "core_hit_rate_pct",\n        "range_bonus_pct",\n        "element_multiplier",\n        "element_multiplier_by_actor",\n        "boss_element",\n        "full_burst_bonus_pct",\n        "boss_damage_taken_pct",\n        "startup_delay_frames",\n        "duration_sec",\n    }\n    _require_exact_keys(payload, keys, "combat_settings")\n    values = dict(payload)\n''','''    required_keys = {\n        "boss_def",\n        "core_hit_rate_pct",\n        "range_bonus_pct",\n        "element_multiplier",\n        "element_multiplier_by_actor",\n        "boss_element",\n        "full_burst_bonus_pct",\n        "boss_damage_taken_pct",\n        "startup_delay_frames",\n        "duration_sec",\n    }\n    optional_keys = {"min_firing_rounds_adjustment"}\n    missing = required_keys - payload.keys()\n    extra = payload.keys() - required_keys - optional_keys\n    if missing or extra:\n        details = []\n        if missing: details.append(f"missing={sorted(missing)}")\n        if extra: details.append(f"extra={sorted(extra)}")\n        raise ValueError("combat_settings has invalid fields: " + ", ".join(details))\n    values = dict(payload)\n    values.setdefault("min_firing_rounds_adjustment", True)\n''')
          PY
      - name: Print corrected baselines
        run: |
          python - <<'PY'
          from dataclasses import replace
          from crown_mast_engine import BuildProfile, GearState, OverloadProfile, analyze_rotations, analyze_entry_variants, ResearchScenario, RAID14_TIMELINE, simulate_rotation
          from crown_mast_engine.combat import CombatSettings
          from crown_mast_engine.models import DamageCategory, TeamRoster
          from crown_mast_engine.rotations import CROWN_CROWN_MAST
          from tests.simulation_fixtures import standard_rotation_comparison

          o=standard_rotation_comparison().overall
          print('STANDARD', repr({'team_c':o.team_c,'team_f':o.team_f,'g':o.g,'l':o.l,'relative':o.team_relative_change,'break_even':o.break_even_main_share_c,'main_share':o.conventional_main_share,'winner':o.observed_winner.value}))

          roster=TeamRoster()
          bare=BuildProfile.uniform(GearState.OL5)
          high=BuildProfile.uniform(GearState.OL5, OverloadProfile(atk_lines=4, element_lines=4, ammo_lines=3))
          extreme=BuildProfile.uniform(GearState.OL5, OverloadProfile(atk_lines=10, element_lines=20, ammo_lines=100))
          base={actor: bare for actor in roster.members}
          cases={
            'all_bare':base,
            'rapi_high':{**base,'rapi-red-hood':high},
            'helm_high':{**base,'helm':high},
            'both_high':{**base,'rapi-red-hood':high,'helm':high},
            'rapi_extreme':{**base,'rapi-red-hood':extreme},
          }
          settings=CombatSettings(boss_element='Wind')
          for name,builds in cases.items():
              x=analyze_rotations(roster=roster, builds=builds, combat_settings=settings, main_actor='rapi-red-hood').overall
              print('OL',name,repr({'team_c':x.team_c,'team_f':x.team_f,'relative':x.team_relative_change,'main_share':x.conventional_main_share,'break_even':x.break_even_main_share_c,'winner':x.observed_winner.value}))

          legacy=analyze_entry_variants(ResearchScenario.standard())
          raid=analyze_entry_variants(replace(ResearchScenario.standard(),timeline=RAID14_TIMELINE))
          print('ENTRY',repr({'relative':raid.first_burst.team.relative_change,'delta':raid.first_burst.team.delta_mast_minus_crown,'legacy_be':legacy.crown_entry.overall.break_even_main_share_c,'raid_be':raid.crown_entry.overall.break_even_main_share_c,'raid_relative':raid.crown_entry.overall.team_relative_change}))

          sbs_roster=TeamRoster(secondary_b3='scarlet-black-shadow')
          sbs=analyze_rotations(roster=sbs_roster).overall
          print('SBS_OVERALL',repr({'team_c':sbs.team_c,'team_f':sbs.team_f,'relative':sbs.team_relative_change,'break_even':sbs.break_even_main_share_c,'main_share':sbs.conventional_main_share}))
          rr=simulate_rotation(CROWN_CROWN_MAST,roster=sbs_roster)
          normals=rr.damage_events_for(actor='scarlet-black-shadow',category=DamageCategory.NORMAL)
          print('SBS_NORMAL_COUNT',len(normals))
          print('SBS_FIRST_NORMAL_TIMES',[e.time for e in normals[:12]])
          PY
