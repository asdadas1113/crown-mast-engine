name: Temporary cadence parity audit

on:
  push:
    branches:
      - research/14-burst-baseline

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source corrections in runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if s.count(old)!=1: raise SystemExit(f'{path}: match={s.count(old)} {old!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          r('crown_mast_engine/combat.py','    boss_damage_taken_pct: float = 0.0\n    startup_delay_frames: int = 8\n','    boss_damage_taken_pct: float = 0.0\n    min_firing_rounds_adjustment: bool = True\n    startup_delay_frames: int = 8\n')
          r('crown_mast_engine/engine.py','                startup_delay_frames=self.combat_settings.startup_delay_frames,\n                shared_charge_modes=shared_charge_modes,\n','                startup_delay_frames=self.combat_settings.startup_delay_frames,\n                pulls_per_second_override=(20.0 if definition.weapon.weapon_type == "SMG" and not self.combat_settings.min_firing_rounds_adjustment else None),\n                shared_charge_modes=shared_charge_modes,\n')
          r('crown_mast_engine/engine.py','                    pulls_per_second_override=mode.pulls_per_second,\n','                    pulls_per_second_override=(mode.pulls_per_second if mode.pulls_per_second is not None else (20.0 if mode.weapon.weapon_type == "SMG" and not self.combat_settings.min_firing_rounds_adjustment else None)),\n')
          r('crown_mast_engine/data/characters.json','          "hit_rate_down_per_stack_pct": 20.0,\n          "expected_normal_damage_loss_per_stack_pct": 20.0,\n','          "hit_rate_down_per_stack_pct": 20.0,\n          "expected_normal_damage_loss_per_stack_pct": 0.0,\n')
          PY
      - name: Print new controlled baselines
        run: |
          python - <<'PY'
          from crown_mast_engine.analysis import analyze_mast_expected_hit_loss_sensitivity
          from tests.simulation_fixtures import standard_rotation_comparison
          a=standard_rotation_comparison(); o=a.overall
          print('STANDARD',repr({'team_c':o.team_c,'team_f':o.team_f,'g':o.g,'l':o.l,'relative':o.team_relative_change,'break_even':o.break_even_main_share_c,'main_share':o.conventional_main_share,'winner':o.observed_winner.value}))
          s=analyze_mast_expected_hit_loss_sensitivity()
          for k,v in s.items():
              print('SENS',k,repr({'team_c':v.overall.team_c,'team_f':v.overall.team_f,'relative':v.overall.team_relative_change,'winner':v.overall.observed_winner.value}))
          PY
