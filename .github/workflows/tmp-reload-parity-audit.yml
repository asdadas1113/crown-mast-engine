name: Temporary standard reload validation

on:
  push:
    branches: [research/14-burst-baseline]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply only cross-checked standard reload values in workspace
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Only units whose ordinary reload is independently supported by current display data
          # plus direct/community timing evidence. Ambiguous/special units are intentionally absent:
          # SBS, Raven, Liberalio, Moran, Milk: Blooming Bunny.
          edits = {
              'crown_mast_engine/data/characters.json': {
                  'liter': 90,
                  'crown': 150,
                  'mast-romantic-maid': 150,
                  'rapi-red-hood': 150,
                  'helm': 120,
                  'anis-star': 120,
                  'little-mermaid': 60,
                  'snow-white-heavy-arms': 120,
                  'epinel': 60,
                  'neon-vision-eye': 120,
              },
              'crown_mast_engine/data/character_cinderella.json': {'cinderella': 120},
              'crown_mast_engine/data/character_cinderella_crystal_wave.json': {'cinderella-crystal-wave': 150},
              'crown_mast_engine/data/character_phantom_favorite_item.json': {'phantom': 120},
              'crown_mast_engine/data/character_bready.json': {'bready': 120},
              'crown_mast_engine/data/character_quency_escape_queen.json': {'quency-escape-queen': 60},
          }
          for path, mapping in edits.items():
              p = Path(path)
              data = json.loads(p.read_text(encoding='utf-8'))
              seen = set()
              for char in data['characters']:
                  slug = char['slug']
                  if slug in mapping:
                      old = char['weapon']['reload_frames']
                      new = mapping[slug]
                      print(f'{slug}: {old} -> {new}')
                      char['weapon']['reload_frames'] = new
                      seen.add(slug)
              missing = set(mapping) - seen
              if missing:
                  raise SystemExit(f'{path}: missing {sorted(missing)}')
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Update direct catalog assertions only; numeric damage regressions are NOT rewritten here.
          p = Path('tests/test_characters.py')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('self.assertEqual(snow.weapon.reload_frames, 141)', 'self.assertEqual(snow.weapon.reload_frames, 120)'),
              ('self.assertEqual(epinel.weapon.reload_frames, 81)', 'self.assertEqual(epinel.weapon.reload_frames, 60)'),
              ('self.assertEqual(neon.weapon.reload_frames, 111)', 'self.assertEqual(neon.weapon.reload_frames, 120)'),
          ]:
              if old not in s:
                  raise SystemExit(f'missing assertion: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --stat
          git diff -- crown_mast_engine/data tests/test_characters.py
      - name: Verify reload formula anchors
        run: |
          PYTHONPATH=. python - <<'PY'
          from crown_mast_engine.characters import STANDARD_CHARACTER_CATALOG
          from crown_mast_engine.combat import effective_reload_frames
          expected = {
              'liter': 90, 'crown': 150, 'mast-romantic-maid': 150,
              'rapi-red-hood': 150, 'helm': 120, 'anis-star': 120,
              'little-mermaid': 60, 'snow-white-heavy-arms': 120,
              'epinel': 60, 'neon-vision-eye': 120, 'cinderella': 120,
              'cinderella-crystal-wave': 150, 'phantom': 120,
              'bready': 120, 'quency-escape-queen': 60,
          }
          for slug, frames in expected.items():
              got = STANDARD_CHARACTER_CATALOG.require(slug).weapon.reload_frames
              assert got == frames, (slug, got, frames)
          # Ore-game standard-reload anchors at 60 FPS:
          # 1.0s -> round(60*.975)+13 = 72f = 1.20s
          # 1.5s -> 101f = 1.683s
          # 2.0s -> 130f = 2.167s
          # 2.5s -> 159f = 2.650s
          assert effective_reload_frames(60, 0) == 72
          assert effective_reload_frames(90, 0) == 101
          assert effective_reload_frames(120, 0) == 130
          assert effective_reload_frames(150, 0) == 159
          print('reload anchors OK')
          PY
      - name: Focused mechanics regression
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest tests.test_combat tests.test_characters tests.test_b1_characters tests.test_cinderella tests.test_cinderella_crystal_wave tests.test_bready tests.test_phantom_favorite_item tests.test_quency_escape_queen tests.test_neon_vision_eye tests.test_snow_white_heavy_arms tests.test_epinel tests.test_analysis tests.test_research tests.test_raid14_research -v 2>&1 | tee /tmp/focused.log
      - name: Full regression
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/full.log
      - name: Summarize failures
        if: always()
        run: |
          echo '=== FOCUSED FAILURES ==='
          grep -E '^(FAIL|ERROR):|^FAILED \(' /tmp/focused.log || true
          echo '=== FULL FAILURES ==='
          grep -E '^(FAIL|ERROR):|^FAILED \(' /tmp/full.log || true
