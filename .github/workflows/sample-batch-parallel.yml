name: Sample batch parallel verification

on:
  pull_request:
    branches:
      - research/14-burst-baseline
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q crown_mast_engine tests scripts
      - name: Sample batch regression tests
        run: python -m unittest discover -s tests -p 'test_samples.py' -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: RAID14 12-point serial versus parallel benchmark
        run: python scripts/benchmark_sample_batch.py
