name: RAID14 batch verification

on:
  push:
    branches:
      - research/14-burst-baseline
  pull_request:
    branches:
      - research/14-burst-baseline
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q crown_mast_engine tests scripts
      - name: Character expansion regression suite
        run: >-
          python -m unittest -v
          tests.test_bready
          tests.test_liberalio
          tests.test_raven
          tests.test_cinderella
          tests.test_cinderella_crystal_wave
          tests.test_rapi_red_hood
          tests.test_character_audit
          tests.test_roster_validation
          tests.test_phantom_favorite_item
          tests.test_milk_blooming_bunny
          tests.test_quency_escape_queen
          tests.test_scarlet_black_shadow
          tests.test_characters
          tests.test_b1_characters
          tests.test_buffs
          tests.test_damage
          tests.test_combat
          tests.test_engine
          tests.test_helm
          tests.test_neon_vision_eye
          tests.test_snow_white_heavy_arms
          tests.test_timeline
          tests.test_checkpoints_v3
          tests.test_official_study

  distributed-pretest:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[distributed-pretest]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        main:
          - scarlet-black-shadow
          - bready
          - quency-escape-queen
          - phantom
          - milk-blooming-bunny
          - rapi-red-hood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile pretest
        run: python -m compileall -q crown_mast_engine scripts/run_distributed_pretest.py
      - name: Distributed Main isolation pretest
        run: python scripts/run_distributed_pretest.py --main ${{ matrix.main }}

  b1-sensitivity-pretest:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b1-sensitivity]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        main:
          - scarlet-black-shadow
          - quency-escape-queen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile B1 sensitivity pretest
        run: python -m compileall -q crown_mast_engine scripts/run_distributed_pretest.py
      - name: Little Mermaid B1 sensitivity pretest
        run: >-
          python scripts/run_distributed_pretest.py
          --b1 little-mermaid
          --main ${{ matrix.main }}

  b1-sensitivity-quency-shard:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b1-sensitivity-quency]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        main_profile:
          - g1-base5-none
          - g2-ol0-sr5
          - g3-ol0-sr15-e3-a3
          - g4-ol5-sr15-e4-a4-ammo3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Quency B1 sensitivity shard
        run: python -m compileall -q crown_mast_engine scripts/run_distributed_pretest.py
      - name: Little Mermaid Quency B1 sensitivity shard
        run: >-
          python scripts/run_distributed_pretest.py
          --b1 little-mermaid
          --main quency-escape-queen
          --main-profile ${{ matrix.main_profile }}

  quency-pretest:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[quency-pretest]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        main_profile:
          - g1-base5-none
          - g2-ol0-sr5
          - g3-ol0-sr15-e3-a3
          - g4-ol5-sr15-e4-a4-ammo3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Quency shard
        run: python -m compileall -q crown_mast_engine scripts/run_distributed_pretest.py
      - name: Quency isolation pretest shard
        run: >-
          python scripts/run_distributed_pretest.py
          --main quency-escape-queen
          --main-profile ${{ matrix.main_profile }}

  distributed-source-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[distributed-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        main:
          - scarlet-black-shadow
          - bready
          - quency-escape-queen
          - phantom
          - milk-blooming-bunny
          - rapi-red-hood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source diagnostic
        run: python -m compileall -q crown_mast_engine scripts/run_distributed_source_diagnostic.py
      - name: Source-level distributed Main diagnostic
        run: python scripts/run_distributed_source_diagnostic.py --main ${{ matrix.main }}

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: RAID14 12-point serial versus parallel benchmark
        run: python scripts/benchmark_sample_batch.py
      - name: RAID14 36-point serial versus parallel benchmark
        run: python scripts/benchmark_checkpoint_v2.py
      - name: RAID14 64-point serial versus parallel benchmark
        run: python scripts/benchmark_checkpoint_v3.py
