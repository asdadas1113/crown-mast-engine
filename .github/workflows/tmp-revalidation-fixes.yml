name: Temporary revalidation fixes

on:
  push:
    branches: [research/14-burst-baseline]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply audited corrections and refresh regression baselines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Generic raid baseline and current PvE firing assumption.
          r('crown_mast_engine/combat.py', 'PULLS_PER_SECOND: dict[str, float] = {\n', '# Current PvE baseline assumes Min Firing Rounds Adjustment is enabled.\nPULLS_PER_SECOND: dict[str, float] = {\n')
          r('crown_mast_engine/combat.py', '    "SMG": 20.0,', '    "SMG": 24.0,')
          r('crown_mast_engine/combat.py', '    boss_def: float = 140.0', '    boss_def: float = 12_000.0')
          r('crown_mast_engine/damage.py', '    boss_def: float = 140.0', '    boss_def: float = 12_000.0')

          # Rapi: Red Hood: the 120-normal-attack gate belongs to Skill 2, not B3.
          r('crown_mast_engine/character_mechanics/rapi_red_hood.py', '        self._pulls = 0\n', '')
          r('crown_mast_engine/character_mechanics/rapi_red_hood.py', '            if self._pulls < context.definition.skill_value("burst", "required_pulls"):\n                return ()\n', '')
          r('crown_mast_engine/character_mechanics/rapi_red_hood.py', '        self._pulls += 1\n', '')
          r('crown_mast_engine/data/characters.json', '          "required_pulls": 120.0,\n', '')

          old_rapi = '''    def test_stage3_missile_requires_120_prior_normal_attacks(self) -> None:\n        early_timeline = (\n            BurstCycle(1, 0.2, 0.4, 0.6, 0.9, 10.9, "main_b3"),\n        )\n        result = simulate_rotation(CROWN_CROWN_MAST, timeline=early_timeline)\n        self.assertFalse(\n            any(event.source == "burst_stage3_missile" for event in result.damage_events)\n        )\n'''
          new_rapi = '''    def test_stage3_missile_does_not_require_prior_normal_attacks(self) -> None:\n        early_timeline = (\n            BurstCycle(1, 0.2, 0.4, 0.6, 0.9, 10.9, "main_b3"),\n        )\n        result = simulate_rotation(CROWN_CROWN_MAST, timeline=early_timeline)\n        missiles = [\n            event\n            for event in result.damage_events\n            if event.source == "burst_stage3_missile"\n        ]\n        self.assertEqual(len(missiles), 1)\n        self.assertEqual(missiles[0].time, 1.0)\n        self.assertTrue(missiles[0].full_burst)\n'''
          r('tests/test_rapi_red_hood.py', old_rapi, new_rapi)

          # Liberalio: 925% additional damage lands about 1.1 s after cast and is FB eligible.
          r('crown_mast_engine/data/character_liberalio.json', '"source_revision": "nikke-sim@43308bd02276a476660e44af730785c2ae91eea3:liberalio datamine+override; Prydwen cross-check@2026-09-02"', '"source_revision": "nikke-sim@43308bd02276a476660e44af730785c2ae91eea3:liberalio datamine+override; Prydwen+NIKKE.gg cross-check@2026-09-05"')
          r('crown_mast_engine/data/character_liberalio.json', '          "duration_sec": 10.0,\n          "damage_pct": 925.0', '          "duration_sec": 10.0,\n          "landing_delay_sec": 1.1,\n          "damage_pct": 925.0')
          r('crown_mast_engine/character_mechanics/liberalio.py', '''    The pinned nikke-sim revision models the 925% Burst packet at Burst cast time;\n    current guide prose describes Liberalio's visual nuke as delayed. Until that\n    landing timing is independently validated for this engine, this hook follows the\n    pinned project source rather than introducing an unverified delay.\n''', '''    Current Prydwen and NIKKE.gg references independently describe the 925%\n    Burst packet as additional damage landing about 1.1 seconds after cast. The\n    delayed packet therefore uses Full Burst and the buffs active at landing.\n''')
          r('crown_mast_engine/character_mechanics/liberalio.py', '''            DamageRequest(\n                time=event.time,\n                actor=context.actor,\n                source="burst_nuke",\n''', '''            DamageRequest(\n                time=round(\n                    event.time\n                    + context.definition.skill_value("burst", "landing_delay_sec"),\n                    6,\n                ),\n                actor=context.actor,\n                source="burst_nuke",\n''')
          r('crown_mast_engine/character_mechanics/liberalio.py', '''                    core_eligible=False,\n                    full_burst_eligible=False,\n                    range_eligible=False,\n''', '''                    core_eligible=False,\n                    full_burst_eligible=True,\n                    range_eligible=False,\n''')

          old_lib = '''    def test_burst_packet_and_self_buff_fire_at_b3_cast(self) -> None:\n        burst_times = tuple(\n            event.time\n            for event in self.result.events\n            if event.event_type == EventType.B3_STAGE_ENTER\n            and event.actor == self.actor\n        )\n        nukes = tuple(\n            event\n            for event in self.result.damage_events_for(\n                actor=self.actor,\n                category=DamageCategory.BURST,\n            )\n            if event.source == "burst_nuke"\n        )\n        self.assertEqual(tuple(event.time for event in nukes), burst_times)\n        self.assertTrue(all(event.coefficient_pct == 925 for event in nukes))\n        self.assertTrue(all(not event.full_burst for event in nukes))\n\n        buffs = tuple(\n            window\n            for window in self.result.buffs.windows\n            if window.source == self.actor\n            and window.skill == "burst"\n            and window.stat == "attack_damage_pct"\n        )\n        self.assertEqual(tuple(window.start for window in buffs), burst_times)\n        self.assertTrue(all(window.value == 50 for window in buffs))\n        for window in buffs:\n            self.assertAlmostEqual(window.end - window.start, 10)\n'''
          new_lib = '''    def test_burst_packet_lands_after_delay_and_uses_full_burst(self) -> None:\n        burst_times = tuple(\n            event.time\n            for event in self.result.events\n            if event.event_type == EventType.B3_STAGE_ENTER\n            and event.actor == self.actor\n        )\n        nukes = tuple(\n            event\n            for event in self.result.damage_events_for(\n                actor=self.actor,\n                category=DamageCategory.BURST,\n            )\n            if event.source == "burst_nuke"\n        )\n        expected_nuke_times = tuple(round(time + 1.1, 6) for time in burst_times)\n        self.assertEqual(tuple(event.time for event in nukes), expected_nuke_times)\n        self.assertTrue(all(event.coefficient_pct == 925 for event in nukes))\n        self.assertTrue(all(event.full_burst for event in nukes))\n\n        buffs = tuple(\n            window\n            for window in self.result.buffs.windows\n            if window.source == self.actor\n            and window.skill == "burst"\n            and window.stat == "attack_damage_pct"\n        )\n        self.assertEqual(tuple(window.start for window in buffs), burst_times)\n        self.assertTrue(all(window.value == 50 for window in buffs))\n        for window in buffs:\n            self.assertAlmostEqual(window.end - window.start, 10)\n'''
          r('tests/test_liberalio.py', old_lib, new_lib)

          # Generic assumption tests.
          r('tests/test_combat.py', '    def test_reload_formula_matches_pinned_runtime(self) -> None:\n', '    def test_default_combat_settings_use_generic_raid_defense(self) -> None:\n        self.assertEqual(CombatSettings().boss_def, 12_000)\n\n    def test_reload_formula_matches_pinned_runtime(self) -> None:\n')
          r('tests/test_combat.py', '''    def test_smg_nominal_rate_is_quantized_to_twenty_pulls_per_second(self) -> None:\n        shots = generate_weapon_shots(\n            actor="test-smg",\n            weapon=weapon("SMG"),\n            duration_sec=1,\n            startup_delay_frames=0,\n        )\n        self.assertEqual(len(shots), 20)\n        self.assertEqual([shot.frame for shot in shots[:4]], [2, 5, 8, 11])\n''', '''    def test_smg_rate_uses_min_firing_rounds_adjusted_twenty_four_per_second(self) -> None:\n        shots = generate_weapon_shots(\n            actor="test-smg",\n            weapon=weapon("SMG"),\n            duration_sec=1,\n            startup_delay_frames=0,\n        )\n        self.assertEqual(len(shots), 24)\n        self.assertEqual([shot.frame for shot in shots[:4]], [2, 4, 7, 9])\n''')

          # Liberalio is no longer part of the cast-instant audit set.
          r('tests/test_character_audit.py', '        ("liberalio", "burst_nuke"),\n', '')
          marker = '''    def test_delayed_rapi_and_ccw_fb_enter_packets_remain_fb_eligible(self) -> None:\n'''
          r('tests/test_character_audit.py', marker, '''    def test_delayed_liberalio_burst_is_full_burst_eligible(self) -> None:\n        result = simulate_rotation(\n            CROWN_CROWN_MAST,\n            roster=TeamRoster(main_b3="liberalio"),\n            timeline=RAID14_TIMELINE,\n        )\n        packet = next(\n            e for e in result.damage_events_for(actor="liberalio")\n            if e.source == "burst_nuke"\n        )\n        self.assertTrue(packet.traits.full_burst_eligible)\n        self.assertTrue(packet.full_burst)\n\n    def test_delayed_rapi_and_ccw_fb_enter_packets_remain_fb_eligible(self) -> None:\n''')

          # Refresh snapshots changed intentionally by DEF/SMG/Rapi corrections.
          replacements = {
              'tests/test_analysis.py': [
                  ('2_144_196_385.5138705', '2_079_946_367.614494'),
                  ('2_118_326_068.3537395', '2_053_522_056.5032187'),
                  ('0.014604144983842327', '0.014909377434629167'),
                  ('0.035212801911879255', '0.03652245461042558'),
                  ('-0.01206527412072489', '-0.012704323305019471'),
                  ('0.7068438374111474', '0.7101138178090082'),
                  ('201_149_946.10748595', '193_243_197.92306998'),
                  ('164_000_383.44454643', '156_151_135.17818892'),
                  ('37_149_562.66293943', '37_092_062.74488106'),
                  ('0.1846859190461244', '0.19194498509410607'),
              ],
              'tests/test_research.py': [
                  ('2_144_196_385.5138705', '2_079_946_367.614494'),
                  ('2_118_326_068.3537395', '2_053_522_056.5032187'),
                  ('0.46465167445141525', '0.4631009699312502'),
                  ('0.7068438374111474', '0.7101138178090082'),
              ],
              'tests/test_raid14_research.py': [
                  ('0.019008968112943725', '0.02034706170578149'),
                  ('0.7068438374111474', '0.7101138178090082'),
                  ('0.6448812467235352', '0.6508108735117237'),
              ],
              'tests/test_scarlet_black_shadow.py': [
                  ('2_101_149_975.2309287', '2_040_564_041.4289405'),
                  ('2_094_367_146.9837704', '2_032_816_835.8842957'),
                  ('-0.0032281504543300032', '-0.003796600051434673'),
                  ('0.4907435342798073', '0.5020292854336021'),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  r(path, old, new)

          # The former rapi_high fixture now sits just below the break-even line;
          # retain the extreme case as the boundary-crossing regression.
          r('tests/test_overload_integration.py', '    def test_representative_ol_cases_cross_the_expected_boundary(self) -> None:\n', '    def test_representative_ol_cases_track_the_updated_boundary(self) -> None:\n')
          r('tests/test_overload_integration.py', '        self.assertEqual(rapi_high.observed_winner, RotationWinner.FUNNEL)\n', '        self.assertEqual(rapi_high.observed_winner, RotationWinner.CONVENTIONAL)\n')
          r('tests/test_overload_integration.py', '        self.assertAlmostEqual(bare.team_relative_change, -0.010917, places=5)\n        self.assertAlmostEqual(rapi_high.team_relative_change, 0.000269, places=5)\n', '        self.assertAlmostEqual(bare.team_relative_change, -0.011499938904004026)\n        self.assertAlmostEqual(rapi_high.team_relative_change, -1.1406497744226307e-05)\n')
          r('tests/test_overload_integration.py', '    def test_main_share_and_break_even_move_with_ol_distribution(self) -> None:\n', '    def test_main_share_moves_toward_break_even_with_ol_distribution(self) -> None:\n')
          r('tests/test_overload_integration.py', '''        self.assertGreater(\n            rapi_high.conventional_main_share,\n            rapi_high.break_even_main_share_c,\n        )\n''', '''        self.assertLess(\n            rapi_high.conventional_main_share,\n            rapi_high.break_even_main_share_c,\n        )\n        self.assertLess(\n            rapi_high.break_even_main_share_c - rapi_high.conventional_main_share,\n            bare.break_even_main_share_c - bare.conventional_main_share,\n        )\n''')
          PY

      - name: Run focused regression
        run: |
          python -m unittest \
            tests.test_combat \
            tests.test_rapi_red_hood \
            tests.test_liberalio \
            tests.test_character_audit \
            tests.test_analysis \
            tests.test_overload_integration \
            tests.test_raid14_research \
            tests.test_research \
            tests.test_scarlet_black_shadow -v

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Commit corrections and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-revalidation-fixes.yml
          git add crown_mast_engine tests
          git commit -m "Fix audited raid baseline and character mechanics"
          git push origin HEAD:research/14-burst-baseline
