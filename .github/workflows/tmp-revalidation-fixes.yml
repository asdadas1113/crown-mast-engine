name: Temporary revalidation fixes

on:
  push:
    branches: [research/14-burst-baseline]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/14-burst-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply audited corrections in runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {s.count(old)}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          r('crown_mast_engine/combat.py', '    "SMG": 20.0,', '    "SMG": 24.0,')
          r('crown_mast_engine/combat.py', '    boss_def: float = 140.0', '    boss_def: float = 12_000.0')
          r('crown_mast_engine/damage.py', '    boss_def: float = 140.0', '    boss_def: float = 12_000.0')

          r('crown_mast_engine/character_mechanics/rapi_red_hood.py', '        self._pulls = 0\n', '')
          r('crown_mast_engine/character_mechanics/rapi_red_hood.py', '            if self._pulls < context.definition.skill_value("burst", "required_pulls"):\n                return ()\n', '')
          r('crown_mast_engine/character_mechanics/rapi_red_hood.py', '        self._pulls += 1\n', '')
          r('crown_mast_engine/data/characters.json', '          "required_pulls": 120.0,\n', '')

          r('crown_mast_engine/data/character_liberalio.json', '"source_revision": "nikke-sim@43308bd02276a476660e44af730785c2ae91eea3:liberalio datamine+override; Prydwen cross-check@2026-09-02"', '"source_revision": "nikke-sim@43308bd02276a476660e44af730785c2ae91eea3:liberalio datamine+override; Prydwen+NIKKE.gg cross-check@2026-09-05"')
          r('crown_mast_engine/data/character_liberalio.json', '          "duration_sec": 10.0,\n          "damage_pct": 925.0', '          "duration_sec": 10.0,\n          "landing_delay_sec": 1.1,\n          "damage_pct": 925.0')
          r('crown_mast_engine/character_mechanics/liberalio.py', '                time=event.time,\n                actor=context.actor,\n                source="burst_nuke",', '                time=round(event.time + context.definition.skill_value("burst", "landing_delay_sec"), 6),\n                actor=context.actor,\n                source="burst_nuke",')
          r('crown_mast_engine/character_mechanics/liberalio.py', '                    core_eligible=False,\n                    full_burst_eligible=False,\n                    range_eligible=False,', '                    core_eligible=False,\n                    full_burst_eligible=True,\n                    range_eligible=False,')
          PY
      - name: Print changed-baseline diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from dataclasses import replace
          from crown_mast_engine import BuildProfile, GearState, OverloadProfile, RAID14_TIMELINE, ResearchScenario, analyze_entry_variants, analyze_rotations
          from crown_mast_engine.combat import CombatSettings
          from crown_mast_engine.models import TeamRoster
          from tests.simulation_fixtures import standard_rotation_comparison

          a = standard_rotation_comparison()
          o = a.overall
          print('STANDARD', repr({
              'team_c': o.team_c, 'team_f': o.team_f, 'g': o.g, 'l': o.l,
              'relative': o.team_relative_change, 'break_even': o.break_even_main_share_c,
              'main_share': o.conventional_main_share, 'winner': o.observed_winner.value,
          }))
          d = a.secondary_b3_mast3_burst_omission_cycle_damage
          print('OMISSION', repr({'c': d.conventional, 'f': d.funnel, 'loss': d.loss_from_funnel, 'relative_loss': d.relative_loss_from_funnel}))

          roster = TeamRoster()
          bare = BuildProfile.uniform(GearState.OL5)
          high = BuildProfile.uniform(GearState.OL5, OverloadProfile(atk_lines=4, element_lines=4, ammo_lines=3))
          extreme = BuildProfile.uniform(GearState.OL5, OverloadProfile(atk_lines=10, element_lines=20, ammo_lines=100))
          base = {actor: bare for actor in roster.members}
          cases = {
              'all_bare': base,
              'rapi_high': {**base, 'rapi-red-hood': high},
              'helm_high': {**base, 'helm': high},
              'both_high': {**base, 'rapi-red-hood': high, 'helm': high},
              'rapi_extreme': {**base, 'rapi-red-hood': extreme},
          }
          settings = CombatSettings(boss_element='Wind')
          for name, builds in cases.items():
              x = analyze_rotations(roster=roster, builds=builds, combat_settings=settings, main_actor='rapi-red-hood').overall
              print('OL', name, repr({'winner': x.observed_winner.value, 'relative': x.team_relative_change, 'main_share': x.conventional_main_share, 'break_even': x.break_even_main_share_c}))

          scenario = replace(ResearchScenario.standard(), timeline=RAID14_TIMELINE)
          rv = analyze_entry_variants(scenario)
          legacy = analyze_entry_variants(ResearchScenario.standard()).crown_entry.overall
          raid = rv.crown_entry.overall
          print('RAID14', repr({'entry_relative': rv.first_burst.team.relative_change, 'entry_delta': rv.first_burst.team.delta_mast_minus_crown, 'legacy_break_even': legacy.break_even_main_share_c, 'raid_break_even': raid.break_even_main_share_c, 'legacy_relative': legacy.team_relative_change, 'raid_relative': raid.team_relative_change}))

          sbs = analyze_rotations(roster=TeamRoster(secondary_b3='scarlet-black-shadow')).overall
          print('SBS', repr({'team_c': sbs.team_c, 'team_f': sbs.team_f, 'relative': sbs.team_relative_change, 'break_even': sbs.break_even_main_share_c, 'main_share': sbs.conventional_main_share, 'winner': sbs.observed_winner.value}))
          PY
